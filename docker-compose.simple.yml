version: '3.8'

services:
  stackcodesy:
    build:
      context: .
      dockerfile: Dockerfile.simple
    image: stackcodesy:simple
    container_name: stackcodesy-simple
    ports:
      - "8889:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - NODE_ENV=development
      - STACKCODESY_REQUIRE_AUTH=false
      - STACKCODESY_TERMINAL_MODE=full
      - STACKCODESY_EXTENSION_MODE=full
      - STACKCODESY_ENABLE_TERMINAL=true
      - STACKCODESY_DISK_QUOTA_MB=0
      - STACKCODESY_MAX_FILE_SIZE_MB=1000
      - STACKCODESY_BLOCK_FILE_TYPES=.exe,.dll,.so.malicious,.sh.malicious
      - STACKCODESY_ENABLE_FS_MONITORING=false
      - STACKCODESY_EGRESS_FILTER=false
      - STACKCODESY_BLOCK_ALL_OUTBOUND=false
      - STACKCODESY_ALLOWED_PORTS=80,443
      - STACKCODESY_ALLOWED_DOMAINS=
      - STACKCODESY_ENABLE_AUDIT_LOG=false
      - STACKCODESY_ENABLE_CSP=false
    volumes:
      - ./workspace:/workspace
      - stackcodesy-data-simple:/home/stackcodesy/.stackcodesy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  stackcodesy-data-simple:
    driver: local
