version: '3.8'

services:
  stackcodesy:
    build:
      context: .
      dockerfile: Dockerfile.rehweb
    image: stackcodesy:rehweb
    container_name: stackcodesy-rehweb
    ports:
      - "8889:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - ./workspace:/workspace
      - stackcodesy-data-rehweb:/home/stackcodesy/.vscode-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  stackcodesy-data-rehweb:
    driver: local
