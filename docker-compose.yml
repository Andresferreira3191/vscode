version: '3.8'

services:
  stackcodesy:
    build:
      context: .
      dockerfile: Dockerfile
    image: stackcodesy:latest
    # Note: container_name removed for Docker Swarm compatibility
    # Swarm will generate container names automatically
    ports:
      # Port mapping (configurable via STACKCODESY_PORT env var)
      # Default: 8080:8080, Custom: set STACKCODESY_PORT=3000 for 3000:3000
      - target: ${STACKCODESY_PORT:-8080}
        published: ${STACKCODESY_PORT:-8080}
        protocol: tcp
        mode: host
    environment:
      # ================================
      # Server Configuration
      # ================================
      - HOST=${STACKCODESY_HOST:-0.0.0.0}
      - PORT=${STACKCODESY_PORT:-8080}
      - NODE_ENV=${NODE_ENV:-production}

      # ================================
      # Authentication Control
      # ================================
      # Set to 'true' to enable authentication, 'false' or leave unset to disable
      # For development/testing: set to false
      # For production: set to true and provide user credentials
      - STACKCODESY_REQUIRE_AUTH=${STACKCODESY_REQUIRE_AUTH:-false}

      # Authentication credentials (only used when STACKCODESY_REQUIRE_AUTH=true)
      # Method 1: Direct environment variables (for testing)
      - STACKCODESY_USER_ID=${STACKCODESY_USER_ID:-}
      - STACKCODESY_USER_NAME=${STACKCODESY_USER_NAME:-}
      - STACKCODESY_USER_EMAIL=${STACKCODESY_USER_EMAIL:-}
      - STACKCODESY_AUTH_TOKEN=${STACKCODESY_AUTH_TOKEN:-}

      # Method 2: API endpoint to validate authentication (recommended for production)
      - STACKCODESY_AUTH_API=${STACKCODESY_AUTH_API:-}

      # ================================
      # Terminal Security Control
      # ================================
      # STACKCODESY_TERMINAL_MODE: Controls terminal access level
      #   - "disabled" or "false": No terminal access (maximum security)
      #   - "restricted": Limited terminal with command whitelist (recommended for production)
      #   - "full" or "true": Full terminal access (development only)
      - STACKCODESY_TERMINAL_MODE=${STACKCODESY_TERMINAL_MODE:-full}

      # ================================
      # Restricted Terminal Configuration
      # (only applies when STACKCODESY_TERMINAL_MODE=restricted)
      # ================================

      # Workspace Directory Restriction
      # Set to 'true' to restrict users to workspace directory only (cannot cd outside)
      - STACKCODESY_TERMINAL_WORKSPACE_ONLY=${STACKCODESY_TERMINAL_WORKSPACE_ONLY:-true}

      # Workspace Directory Path
      # The directory users are restricted to
      - STACKCODESY_WORKSPACE_DIR=${STACKCODESY_WORKSPACE_DIR:-/workspace}

      # Allowed Commands (comma-separated list)
      # Only these commands can be executed in restricted mode
      # Default includes common build tools and package managers
      - STACKCODESY_TERMINAL_ALLOWED_COMMANDS=${STACKCODESY_TERMINAL_ALLOWED_COMMANDS:-npm,yarn,pnpm,node,git,python,python3,pip,pip3,make,cmake,gcc,g++,clang,rustc,cargo,go,java,javac,mvn,gradle,dotnet,ruby,gem,bundle,php,composer}

      # Blocked Commands (comma-separated list of dangerous patterns)
      # These commands/patterns are always blocked regardless of allowed list
      - STACKCODESY_TERMINAL_BLOCKED_COMMANDS=${STACKCODESY_TERMINAL_BLOCKED_COMMANDS:-rm -rf,dd,mkfs,fdisk,parted,reboot,shutdown,init,systemctl,service,chmod 777,chown,sudo,su,passwd,useradd,usermod,userdel,wget,curl,nc,netcat,telnet,ssh,scp,sftp,ftp}

      # Block Network Access from Terminal
      # Set to 'true' to block network commands (wget, curl, etc.)
      - STACKCODESY_TERMINAL_BLOCK_NETWORK=${STACKCODESY_TERMINAL_BLOCK_NETWORK:-false}

      # Maximum Command Length
      # Prevents excessively long commands (potential attack vector)
      - STACKCODESY_TERMINAL_MAX_COMMAND_LENGTH=${STACKCODESY_TERMINAL_MAX_COMMAND_LENGTH:-1000}

      # ================================
      # Extension Marketplace Security
      # ================================
      # Extension marketplace control: disabled, whitelist, full
      - STACKCODESY_EXTENSION_MODE=${STACKCODESY_EXTENSION_MODE:-full}
      # Comma-separated list of approved extension IDs
      - STACKCODESY_EXTENSION_WHITELIST=${STACKCODESY_EXTENSION_WHITELIST:-}
      # Path to approved extensions file
      - STACKCODESY_EXTENSION_WHITELIST_FILE=${STACKCODESY_EXTENSION_WHITELIST_FILE:-/stackcodesy/config/approved-extensions.txt}

      # ================================
      # File System Security
      # ================================
      # Disk quota in MB (0 = unlimited)
      - STACKCODESY_DISK_QUOTA_MB=${STACKCODESY_DISK_QUOTA_MB:-5000}
      # Maximum file size in MB
      - STACKCODESY_MAX_FILE_SIZE_MB=${STACKCODESY_MAX_FILE_SIZE_MB:-100}
      # Blocked file extensions
      - STACKCODESY_BLOCKED_FILE_TYPES=${STACKCODESY_BLOCKED_FILE_TYPES:-.exe,.dll,.so.malicious}
      # Enable filesystem monitoring
      - STACKCODESY_ENABLE_FILE_MONITORING=${STACKCODESY_ENABLE_FILE_MONITORING:-false}
      # Read-only directories
      - STACKCODESY_READONLY_DIRS=${STACKCODESY_READONLY_DIRS:-}

      # ================================
      # Network Security
      # ================================
      # Enable egress filtering (requires CAP_NET_ADMIN capability)
      - STACKCODESY_ENABLE_EGRESS_FILTER=${STACKCODESY_ENABLE_EGRESS_FILTER:-false}
      # Block all outbound traffic
      - STACKCODESY_BLOCK_ALL_OUTBOUND=${STACKCODESY_BLOCK_ALL_OUTBOUND:-false}
      # Allowed outbound ports
      - STACKCODESY_ALLOWED_PORTS=${STACKCODESY_ALLOWED_PORTS:-80,443}
      # Allowed domains
      - STACKCODESY_ALLOWED_DOMAINS=${STACKCODESY_ALLOWED_DOMAINS:-}
      # Enable DNS filtering
      - STACKCODESY_ENABLE_DNS_FILTER=${STACKCODESY_ENABLE_DNS_FILTER:-false}

      # ================================
      # Audit Logging
      # ================================
      # Enable comprehensive audit logging
      - STACKCODESY_ENABLE_AUDIT_LOG=${STACKCODESY_ENABLE_AUDIT_LOG:-true}
      # Audit log directory
      - STACKCODESY_AUDIT_LOG_DIR=${STACKCODESY_AUDIT_LOG_DIR:-/var/log/stackcodesy}
      # Log retention in days
      - STACKCODESY_AUDIT_LOG_RETENTION_DAYS=${STACKCODESY_AUDIT_LOG_RETENTION_DAYS:-30}
      # Log terminal commands
      - STACKCODESY_LOG_TERMINAL_COMMANDS=${STACKCODESY_LOG_TERMINAL_COMMANDS:-true}
      # Log file access
      - STACKCODESY_LOG_FILE_ACCESS=${STACKCODESY_LOG_FILE_ACCESS:-false}
      # Log authentication events
      - STACKCODESY_LOG_AUTH_EVENTS=${STACKCODESY_LOG_AUTH_EVENTS:-true}

      # ================================
      # Content Security Policy
      # ================================
      # Enable CSP headers
      - STACKCODESY_ENABLE_CSP=${STACKCODESY_ENABLE_CSP:-true}
      # CSP policy level: strict, moderate, relaxed
      - STACKCODESY_CSP_POLICY=${STACKCODESY_CSP_POLICY:-relaxed}

    volumes:
      # Workspace directory - mount your project here
      # For Swarm: use named volumes or NFS mounts
      - type: volume
        source: stackcodesy-workspace
        target: /workspace

      # User settings and extensions
      - type: volume
        source: stackcodesy-data
        target: /home/stackcodesy/.stackcodesy

      # Optional: Additional project directories
      # - type: volume
      #   source: stackcodesy-projects
      #   target: /projects

    # Docker Swarm deployment configuration
    deploy:
      mode: replicated
      replicas: 1
      # For load balancing across multiple users:
      # replicas: 3

      # Placement constraints (optional)
      # placement:
      #   constraints:
      #     - node.role == worker
      #     - node.labels.type == editor

      # Resource limits (adjust based on your needs)
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      # Update configuration (for rolling updates)
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3

      # Rollback configuration
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.3

    # Networking
    networks:
      - stackcodesy-network

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    # Security options
    # Uncomment the following for enhanced security:
    # security_opt:
    #   # AppArmor profile (requires profile to be loaded on host)
    #   - apparmor=stackcodesy
    #   # Seccomp profile (syscall filtering)
    #   - seccomp=./security/seccomp-profile.json
    #   # Disable new privileges
    #   - no-new-privileges:true

    # Additional security capabilities
    # For network filtering, uncomment the following:
    # cap_add:
    #   - NET_ADMIN
    # For maximum security, drop all capabilities:
    # cap_drop:
    #   - ALL
    # Then add only required capabilities:
    # cap_add:
    #   - CHOWN
    #   - DAC_OVERRIDE
    #   - SETGID
    #   - SETUID

    # Logging (for Swarm)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,stack"

# Volumes
volumes:
  stackcodesy-workspace:
    driver: local
    # For production with Swarm, consider using NFS or other distributed storage
    # driver_opts:
    #   type: nfs
    #   o: addr=nfs-server.example.com,rw
    #   device: ":/path/to/workspace"

  stackcodesy-data:
    driver: local
    # For multi-node Swarm, use distributed storage
    # driver: rexray/ebs
    # driver_opts:
    #   size: 10

# Networks
networks:
  stackcodesy-network:
    driver: overlay  # Use overlay for Swarm
    # For external network access control:
    # driver_opts:
    #   encrypted: "true"
    attachable: true

# ================================
# Deployment Examples
# ================================
#
# Development (local):
#   docker-compose up
#
# Docker Swarm (production):
#   docker stack deploy -c docker-compose.yml stackcodesy
#
# Update service in Swarm:
#   docker service update --image stackcodesy:latest stackcodesy_stackcodesy
#
# Scale service:
#   docker service scale stackcodesy_stackcodesy=3
#
# Remove stack:
#   docker stack rm stackcodesy
