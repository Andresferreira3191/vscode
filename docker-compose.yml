version: '3.8'

services:
  stackcodesy:
    build:
      context: .
      dockerfile: Dockerfile
    image: stackcodesy:latest
    # Note: container_name removed for Docker Swarm compatibility
    # Swarm will generate container names automatically
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    environment:
      # ================================
      # Server Configuration
      # ================================
      - HOST=0.0.0.0
      - PORT=8080
      - NODE_ENV=production

      # ================================
      # Authentication Control
      # ================================
      # Set to 'true' to enable authentication, 'false' or leave unset to disable
      # For development/testing: set to false
      # For production: set to true and provide user credentials
      - STACKCODESY_REQUIRE_AUTH=${STACKCODESY_REQUIRE_AUTH:-false}

      # Authentication credentials (only used when STACKCODESY_REQUIRE_AUTH=true)
      # Method 1: Direct environment variables (for testing)
      - STACKCODESY_USER_ID=${STACKCODESY_USER_ID:-}
      - STACKCODESY_USER_NAME=${STACKCODESY_USER_NAME:-}
      - STACKCODESY_USER_EMAIL=${STACKCODESY_USER_EMAIL:-}
      - STACKCODESY_AUTH_TOKEN=${STACKCODESY_AUTH_TOKEN:-}

      # Method 2: API endpoint to validate authentication (recommended for production)
      - STACKCODESY_AUTH_API=${STACKCODESY_AUTH_API:-}

      # ================================
      # Terminal Security Control
      # ================================
      # STACKCODESY_TERMINAL_MODE: Controls terminal access level
      #   - "disabled" or "false": No terminal access (maximum security)
      #   - "restricted": Limited terminal with command whitelist (recommended for production)
      #   - "full" or "true": Full terminal access (development only)
      - STACKCODESY_TERMINAL_MODE=${STACKCODESY_TERMINAL_MODE:-full}

      # ================================
      # Restricted Terminal Configuration
      # (only applies when STACKCODESY_TERMINAL_MODE=restricted)
      # ================================

      # Workspace Directory Restriction
      # Set to 'true' to restrict users to workspace directory only (cannot cd outside)
      - STACKCODESY_TERMINAL_WORKSPACE_ONLY=${STACKCODESY_TERMINAL_WORKSPACE_ONLY:-true}

      # Workspace Directory Path
      # The directory users are restricted to
      - STACKCODESY_WORKSPACE_DIR=${STACKCODESY_WORKSPACE_DIR:-/workspace}

      # Allowed Commands (comma-separated list)
      # Only these commands can be executed in restricted mode
      # Default includes common build tools and package managers
      - STACKCODESY_TERMINAL_ALLOWED_COMMANDS=${STACKCODESY_TERMINAL_ALLOWED_COMMANDS:-npm,yarn,pnpm,node,git,python,python3,pip,pip3,make,cmake,gcc,g++,clang,rustc,cargo,go,java,javac,mvn,gradle,dotnet,ruby,gem,bundle,php,composer}

      # Blocked Commands (comma-separated list of dangerous patterns)
      # These commands/patterns are always blocked regardless of allowed list
      - STACKCODESY_TERMINAL_BLOCKED_COMMANDS=${STACKCODESY_TERMINAL_BLOCKED_COMMANDS:-rm -rf,dd,mkfs,fdisk,parted,reboot,shutdown,init,systemctl,service,chmod 777,chown,sudo,su,passwd,useradd,usermod,userdel,wget,curl,nc,netcat,telnet,ssh,scp,sftp,ftp}

      # Block Network Access from Terminal
      # Set to 'true' to block network commands (wget, curl, etc.)
      - STACKCODESY_TERMINAL_BLOCK_NETWORK=${STACKCODESY_TERMINAL_BLOCK_NETWORK:-false}

      # Maximum Command Length
      # Prevents excessively long commands (potential attack vector)
      - STACKCODESY_TERMINAL_MAX_COMMAND_LENGTH=${STACKCODESY_TERMINAL_MAX_COMMAND_LENGTH:-1000}

    volumes:
      # Workspace directory - mount your project here
      # For Swarm: use named volumes or NFS mounts
      - type: volume
        source: stackcodesy-workspace
        target: /workspace

      # User settings and extensions
      - type: volume
        source: stackcodesy-data
        target: /home/stackcodesy/.stackcodesy

      # Optional: Additional project directories
      # - type: volume
      #   source: stackcodesy-projects
      #   target: /projects

    # Docker Swarm deployment configuration
    deploy:
      mode: replicated
      replicas: 1
      # For load balancing across multiple users:
      # replicas: 3

      # Placement constraints (optional)
      # placement:
      #   constraints:
      #     - node.role == worker
      #     - node.labels.type == editor

      # Resource limits (adjust based on your needs)
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      # Update configuration (for rolling updates)
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3

      # Rollback configuration
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.3

    # Networking
    networks:
      - stackcodesy-network

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    # Logging (for Swarm)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,stack"

# Volumes
volumes:
  stackcodesy-workspace:
    driver: local
    # For production with Swarm, consider using NFS or other distributed storage
    # driver_opts:
    #   type: nfs
    #   o: addr=nfs-server.example.com,rw
    #   device: ":/path/to/workspace"

  stackcodesy-data:
    driver: local
    # For multi-node Swarm, use distributed storage
    # driver: rexray/ebs
    # driver_opts:
    #   size: 10

# Networks
networks:
  stackcodesy-network:
    driver: overlay  # Use overlay for Swarm
    # For external network access control:
    # driver_opts:
    #   encrypted: "true"
    attachable: true

# ================================
# Deployment Examples
# ================================
#
# Development (local):
#   docker-compose up
#
# Docker Swarm (production):
#   docker stack deploy -c docker-compose.yml stackcodesy
#
# Update service in Swarm:
#   docker service update --image stackcodesy:latest stackcodesy_stackcodesy
#
# Scale service:
#   docker service scale stackcodesy_stackcodesy=3
#
# Remove stack:
#   docker stack rm stackcodesy
