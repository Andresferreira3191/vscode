version: '3.8'

services:
  stackcodesy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stackcodesy-editor
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - NODE_ENV=production

      # Authentication Control
      # Set to 'true' to enable authentication, 'false' or leave unset to disable
      # For development/testing: set to false or comment out
      # For production: set to true and provide user credentials
      - STACKCODESY_REQUIRE_AUTH=${STACKCODESY_REQUIRE_AUTH:-false}

      # StackCodeSy Authentication (only used when STACKCODESY_REQUIRE_AUTH=true)
      # Method 1: Direct environment variables (for testing)
      - STACKCODESY_USER_ID=${STACKCODESY_USER_ID:-}
      - STACKCODESY_USER_NAME=${STACKCODESY_USER_NAME:-}
      - STACKCODESY_USER_EMAIL=${STACKCODESY_USER_EMAIL:-}
      - STACKCODESY_AUTH_TOKEN=${STACKCODESY_AUTH_TOKEN:-}

      # Method 2: API endpoint to validate authentication
      # Your platform can expose an API that validates user sessions
      - STACKCODESY_AUTH_API=${STACKCODESY_AUTH_API:-}

    volumes:
      # Mount workspace directory (optional - uncomment to use)
      # - ./workspace:/home/stackcodesy/workspace

      # Persist user settings and extensions
      - stackcodesy-data:/home/stackcodesy/.stackcodesy

      # If you want to persist projects (optional)
      # - ./projects:/home/stackcodesy/projects

    restart: unless-stopped

    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    # Networking
    networks:
      - stackcodesy-network

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Optional: Add a reverse proxy (nginx) for SSL and routing
  # nginx:
  #   image: nginx:alpine
  #   container_name: stackcodesy-proxy
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - stackcodesy
  #   networks:
  #     - stackcodesy-network

volumes:
  stackcodesy-data:
    driver: local

networks:
  stackcodesy-network:
    driver: bridge
