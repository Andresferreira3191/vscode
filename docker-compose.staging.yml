version: '3.8'

services:
  stackcodesy:
    build:
      context: .
      dockerfile: Dockerfile
    image: stackcodesy:latest
    container_name: stackcodesy-staging
    ports:
      - "8080:8080"
    environment:
      # ================================
      # Staging Mode - Moderate Security
      # For testing with some restrictions
      # ================================
      - HOST=0.0.0.0
      - PORT=8080
      - NODE_ENV=staging

      # Authentication: OPTIONAL (configure as needed)
      - STACKCODESY_REQUIRE_AUTH=${STACKCODESY_REQUIRE_AUTH:-false}
      - STACKCODESY_AUTH_API=${STACKCODESY_AUTH_API:-}

      # Terminal: RESTRICTED (but allows most commands)
      - STACKCODESY_TERMINAL_MODE=restricted
      - STACKCODESY_TERMINAL_WORKSPACE_ONLY=true
      - STACKCODESY_WORKSPACE_DIR=/workspace
      - STACKCODESY_TERMINAL_ALLOWED_COMMANDS=npm,yarn,pnpm,node,git,python,python3,pip,pip3,make,cmake,gcc,g++,go,java,mvn,gradle,rustc,cargo,dotnet,ruby,php
      - STACKCODESY_TERMINAL_BLOCKED_COMMANDS=rm -rf /,dd,mkfs,fdisk,sudo,su,passwd
      - STACKCODESY_TERMINAL_BLOCK_NETWORK=false
      - STACKCODESY_TERMINAL_MAX_COMMAND_LENGTH=2000

      # Extensions: FULL (for testing extensions)
      - STACKCODESY_EXTENSION_MODE=full

      # File System: MODERATE RESTRICTIONS
      - STACKCODESY_DISK_QUOTA_MB=10000
      - STACKCODESY_MAX_FILE_SIZE_MB=500
      - STACKCODESY_BLOCKED_FILE_TYPES=.exe,.dll
      - STACKCODESY_ENABLE_FILE_MONITORING=false
      - STACKCODESY_READONLY_DIRS=/stackcodesy

      # Network: NO RESTRICTIONS (for testing integrations)
      - STACKCODESY_ENABLE_EGRESS_FILTER=false
      - STACKCODESY_BLOCK_ALL_OUTBOUND=false

      # Audit Logging: MODERATE
      - STACKCODESY_ENABLE_AUDIT_LOG=true
      - STACKCODESY_LOG_TERMINAL_COMMANDS=true
      - STACKCODESY_LOG_FILE_ACCESS=false
      - STACKCODESY_LOG_AUTH_EVENTS=true

      # Content Security Policy: MODERATE
      - STACKCODESY_ENABLE_CSP=true
      - STACKCODESY_CSP_POLICY=moderate

    volumes:
      - stackcodesy-workspace-staging:/workspace
      - stackcodesy-data-staging:/home/stackcodesy/.stackcodesy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  stackcodesy-workspace-staging:
    driver: local
  stackcodesy-data-staging:
    driver: local
